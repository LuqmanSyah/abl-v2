name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: sqlite3, mbstring, json, dom, gd
          tools: composer

      - run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=/' .env
          sed -i '/^DB_DATABASE=/d' .env
          echo 'DB_DATABASE=' >> .env
          sed -i 's/SESSION_DRIVER=database/SESSION_DRIVER=array/' .env
          sed -i 's/QUEUE_CONNECTION=database/QUEUE_CONNECTION=sync/' .env
          sed -i 's/CACHE_STORE=database/CACHE_STORE=array/' .env
          sed -i 's/BROADCAST_CONNECTION=log/BROADCAST_CONNECTION=null/' .env

      - run: composer install --no-interaction --prefer-dist

      - run: php artisan key:generate

      - run: php artisan test
