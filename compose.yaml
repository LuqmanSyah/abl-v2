services:
  mysql:
    image: mysql:8.4.10
    ports:
      - "127.0.0.1:${DB_PORT:-9906}:3306"
    environment:
      TZ: "${APP_TIMEZONE:-Asia/Jakarta}"
      MYSQL_DATABASE: "${DB_DATABASE:-abl}"
      MYSQL_USER: "${DB_USERNAME:-abl}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    command: ["--default-time-zone=+07:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
